name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tagplatform
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: tagplatform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tagplatform"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://tagplatform:ci-password@localhost:5432/tagplatform
      TEST_DATABASE_URL: postgres://tagplatform:ci-password@localhost:5432/tagplatform_test
      MAIL_OUTBOX_DIR: ./.mail-outbox
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate a throwaway auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Lint, types and formatting
        run: |
          npm run lint
          npm run typecheck
          npm run format:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Migrations match the schema
        run: |
          npx drizzle-kit check
          npm run db:generate -- --name ci-drift-check
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run npm run db:generate and commit it."
            git status --porcelain db/migrations
            exit 1
          fi

      - name: Prepare databases
        run: |
          PGPASSWORD=ci-password psql -h localhost -U tagplatform -c "CREATE DATABASE tagplatform_test;"
          npm run db:migrate

      - name: Unit and integration tests
        run: npm test

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
