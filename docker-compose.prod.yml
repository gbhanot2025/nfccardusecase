# Production stack on one VM. Only Caddy is reachable from the internet (80/443).
# Usage (see docs/runbook.md):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrator
name: tagplatform

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://tagplatform:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/tagplatform
      OPENBAO_ADDR: http://openbao:8200
      S3_ENDPOINT: http://seaweedfs:8333
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  migrator:
    build: { context: ., target: migrator }
    profiles: ["tools"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://tagplatform:${POSTGRES_PASSWORD}@postgres:5432/tagplatform
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tagplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tagplatform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagplatform"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      DATABASE_URL: postgres://tagplatform:${POSTGRES_PASSWORD}@postgres:5432/tagplatform
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  openbao:
    image: openbao/openbao:latest
    restart: unless-stopped
    command: server -config=/openbao/config/config.hcl
    cap_add: [IPC_LOCK]
    volumes:
      - ./docker/openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao_data:/openbao/data
    logging: *logging

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: "server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3.json"
    volumes:
      - s3data:/data
      - ${S3_CONFIG_FILE:-./docker/seaweedfs/s3.json}:/etc/seaweedfs/s3.json:ro
    logging: *logging

volumes:
  pgdata:
  s3data:
  openbao_data:
  caddy_data:
  caddy_config:
